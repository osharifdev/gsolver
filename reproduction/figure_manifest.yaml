# ============================================================================
# Figure/Table reproduction manifest
# Paper: "Breaking Time: A Fully Gaussian Framework for Distributed and
#         Continuous-Time SLAM" (arXiv:2606.06250v1)
# Repository commit: e50581f5f00cbe6239d498512a1b0aa9fa2d03ac
#
# status values: READY | PARTIALLY_READY | MISSING_RAW_PAPER_DATA |
#   MISSING_DATASET | MISSING_BASELINE | MISSING_CONFIGURATION | BLOCKED |
#   REPRODUCED
# NOTE: initial statuses written during Phase 1; updated to REPRODUCED /
#   final blockers as experiments complete. paper_values_source records where
#   the reference values for comparison come from.
# ============================================================================

defaults: &defaults
  repository_commit: e50581f5f00cbe6239d498512a1b0aa9fa2d03ac
  build: "cmake -DGSOLVER_BUILD_EXAMPLES=ON -DCMAKE_BUILD_TYPE=Release && make"
  config_file: examples/config/experiment_params.yaml
  random_seed: 42            # dataset generation & charuco perturbation (from code)
  repetitions: 1             # single realisation per config (no repetition logic in repo)
  paper_hardware: "Intel Core i9-14900KF (16 physical cores)"
  local_hardware: "AMD EPYC 7713 (64 physical cores), RHEL 9.7, GCC 11.5.0"

figure_1:
  <<: *defaults
  paper_id: "Figure 1"
  caption: >-
    Querying continuous-time mean and covariance. G-solver GP-based trajectory
    estimate on a torus motion sequence; shaded posterior covariance expands in
    segments with fewer observations; query at arbitrary timestamps.
  experiment: prior-type solve + continuous GP query of mean and covariance
  methods: [gsolver]
  dataset: "torus motion sequence — NOT IN REPOSITORY (no torus generator, no torus qc_diag)"
  parameter_sweep: none
  metrics: [qualitative_artifact]
  expected_panels: ["single 3D panel: mean curve + covariance envelope + knot markers"]
  paper_exact_values: none (qualitative)
  executable: "reproduction/src/repro_synthetic (new; official apps lack covariance export)"
  input_data: "MISSING original; substitute torus generated by reproduction/src/torus_generator"
  expected_outputs:
    - reproduction/results/local_gsolver/figure_01_substitute/interp.csv
    - reproduction/figures/local/figure_01_substitute.{png,pdf}
  plotting: reproduction/scripts/build_all_figures.py --figure 1
  baselines_required: none
  status: MISSING_DATASET  # FINAL: substitute REPRODUCED (labelled); original blocked
  blockers:
    - original torus trajectory, its observation layout (dense/sparse regions)
      and its qc_diag are not in the repository or its history
  notes: >-
    Substitute reproduction produced with a clearly-labelled locally generated
    torus (own generator + gp_hyperparam_trainer for Qc). The repository asset
    assets/teaser.png is a rendered copy of the paper figure (reference only).

figure_5:
  <<: *defaults
  paper_id: "Figure 5"
  caption: >-
    Total energy over iterations: G-solver and Gauss-Newton (GN)+GP total energy
    (Eq. 18) while solving PGO on Helix, sigma=0.1, eta_ig=1 (both m and rad).
  experiment: PGO helix; energy Eq.18 (measurement + GP factor energies) per iteration
  methods: [gsolver, gn_gp]
  dataset: examples/data/datasets/synthetic/pgo/trajectories_1hz/noise_ig1.0_n0.1_helix.g2o
  parameter_sweep: "iterations 0..25 shown in paper (config runs 100; exact plotted range 0..25 from figure axis)"
  metrics: [total_energy]
  expected_panels: ["single panel: E_tot vs iteration, 2 curves"]
  paper_exact_values: "none printed; curve values must be digitised (start ~530 GN / ~450 Ours)"
  executable: reproduction/src/repro_synthetic (energy instrumentation, read-only)
  input_data: as dataset above (translation sigma 0.1 pairs with rotation sigma 0.01 per generator)
  expected_outputs:
    - reproduction/results/local_gsolver/figure_05/energy.csv   # iteration,method,total_energy
    - reproduction/figures/local/figure_05.{png,pdf}
  plotting: reproduction/scripts/build_all_figures.py --figure 5
  baselines_required: ["GN+GP (same GP prior, batch Gauss-Newton)"]
  status: PARTIALLY_READY  # FINAL: G-solver curve REPRODUCED in shape; paper y-scale not reproducible from documented config; GN baseline missing (reimplementation supplied)
  blockers:
    - GN+GP baseline implementation absent from repository -> MISSING_BASELINE;
      an independently implemented GN+GP is provided and labelled
      "gn_gp_reimplementation (supplementary, NOT the paper baseline)"
    - paper curve y-values available only via PDF digitisation

